---
- name: "Provision remote server"
  hosts: all
  handlers:
    - include_tasks: ../handlers/global.yml
  connection: ssh
  become: yes
  become_user: root
  become_method: sudo
  gather_facts: yes
  force_handlers: true
  any_errors_fatal: true

  tasks:
    - include_role:
        name: bbb-lxc
        tasks_from: install_filebeat_instances.yml

