[defaults]
# Roles path
roles_path = ./roles

# Inventory path
inventory = ./inventory/hosts.ini

# Default remote user
remote_user = root

# Ask for sudo password
ask_become_pass = True

# Logging
log_path = ./ansible.log

# Host key checking (disable for development, enable for production)
host_key_checking = False

# Retry files
retry_files_enabled = True
retry_files_save_path = ./

# SSH timeout
timeout = 30

# Display skipped hosts - set to False to reduce noise in output
# Skipped tasks will still appear in profile_tasks if they take time to evaluate
display_skipped_hosts = False

# Show task path to help identify where tasks come from
display_args_to_stdout = False

# Callbacks
callbacks_enabled = profile_tasks, timer

[callback_profile_tasks]
# Sort tasks by execution order, not by total time
sort_order = none
# Alternatively you can use: sort_order = ascending or sort_order = descending
# none = execution order (default is descending by time)

# Only show tasks that took more than this many seconds (filters out skipped tasks)
task_output_limit = 20

# Show task result (ok, changed, skipped, failed)
# This helps identify which tasks actually ran vs were skipped
# Note: This is not a standard option, but we can use display_skipped_hosts instead

# Gathering
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

