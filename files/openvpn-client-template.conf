client
dev tun
proto udp

# Replace with your VPN server IP or hostname
remote YOUR_VPN_SERVER_IP 1194

# Keep trying to resolve server hostname
resolv-retry infinite

# Don't bind to local port/interface
nobind

# Run with reduced privileges after initialization
user nobody
group nogroup

# Persist keys and tunnel across restarts
persist-key
persist-tun

# SSL/TLS parameters
ca ca.crt
cert client1.crt
key client1.key

# TLS authentication
tls-auth ta.key 1
key-direction 1

# Verify server certificate
remote-cert-tls server

# Cryptographic cipher (must match server)
cipher AES-256-GCM
auth SHA256

# Enable compression (must match server)
compress lz4-v2

# Logging
verb 3

# CRITICAL: Don't pull default gateway route
# This prevents routing ALL traffic through VPN
route-nopull

# METHOD 1: NAT Alias (RECOMMENDED for subnet conflicts)
# Access remote 192.168.0.x LAN via 10.127.0.x alias
route 10.127.0.0 255.255.255.0 vpn_gateway

# METHOD 2: Direct Split-Tunnel (uncomment if not using NAT alias)
# Direct route to remote LAN (cannot access local 192.168.0.x while connected)
# route 192.168.0.0 255.255.255.0 vpn_gateway

