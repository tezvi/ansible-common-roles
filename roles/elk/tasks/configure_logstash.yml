---
# Configure Logstash

- name: Check if Logstash is installed
  command: systemctl list-unit-files logstash.service
  register: logstash_installed
  changed_when: false
  failed_when: false

- name: Configure Logstash
  block:
    - name: Create Logstash pipeline configuration directory
      file:
        path: /etc/logstash/conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create Logstash beats input configuration
      template:
        src: logstash-beats-input.conf.j2
        dest: /etc/logstash/conf.d/01-beats-input.conf
        owner: root
        group: root
        mode: '0644'
        backup: yes
      notify: restart logstash

    - name: Create Logstash elasticsearch output configuration
      template:
        src: logstash-elasticsearch-output.conf.j2
        dest: /etc/logstash/conf.d/30-elasticsearch-output.conf
        owner: root
        group: root
        mode: '0644'
        backup: yes
      notify: restart logstash

    - name: Ensure Logstash is enabled and started
      systemd:
        name: logstash
        enabled: yes
        state: started

  when: logstash_installed.rc == 0

